<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- White background with thick black border (neo-brutalist) -->
  <rect x="2" y="2" width="60" height="60" fill="white" stroke="black" stroke-width="4"/>
  <!-- Accent shadow offset rectangle -->
  <rect x="6" y="6" width="60" height="60" fill="#2563eb" stroke="black" stroke-width="4"/>
  <!-- White foreground card -->
  <rect x="2" y="2" width="60" height="60" fill="white" stroke="black" stroke-width="4"/>
  <!-- Bold H letter -->
  <text
    x="32"
    y="48"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="46"
    fill="black"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-2"
  >H</text>
</svg>
